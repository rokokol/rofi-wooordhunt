name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }
      - run: nix build --no-write-lock-file .#rofi-wooordhunt
      # tests, package-smoke, package-settings, module-wiring, scripts-lint
      - run: nix flake check --no-write-lock-file
      # The scripts must stay usable without Nix: install.sh puts the launcher behind a
      # symlink, keeps the modi off bin, and the suite has to pass against both copies
      - name: install.sh works
        run: |
          # The runner has no pup, and the preflight rightly refuses without it — the
          # deps come from the flake's own lock (the dev shell), never from an unpinned
          # registry lookup; the distro suite is where the printed guidance provides
          # them for real
          PREFIX=$PWD/out nix develop --no-write-lock-file -c ./install.sh
          test -L out/bin/rofi-wooordhunt
          test ! -e out/bin/wooordhunt-modi
          test -f out/share/rofi-wooordhunt/install-manifest
          out/bin/rofi-wooordhunt --version | grep -xF "rofi-wooordhunt $(cat VERSION)"
          nix develop --no-write-lock-file \
            -c env ROFI_WOOORDHUNT="$PWD/out/bin/rofi-wooordhunt" \
            ROFI_WOOORDHUNT_MODI="$PWD/out/share/rofi-wooordhunt/wooordhunt-modi.sh" \
            ./tests/run.sh
          # The baking flags swap the symlink for a wrapper; a run without them puts the
          # symlink back — the flags are declarative
          PREFIX=$PWD/out nix develop --no-write-lock-file -c ./install.sh --prompt test --timeout 7
          test ! -L out/bin/rofi-wooordhunt
          grep -qF 'ROFI_WOOORDHUNT_TIMEOUT:-7' out/bin/rofi-wooordhunt
          PREFIX=$PWD/out nix develop --no-write-lock-file -c ./install.sh
          test -L out/bin/rofi-wooordhunt
          # Uninstall consumes the manifest and leaves nothing of ours behind
          PREFIX=$PWD/out ./install.sh --uninstall
          test ! -e out/bin/rofi-wooordhunt
          test ! -e out/share/rofi-wooordhunt
          nix develop --no-write-lock-file -c ./install.sh --destdir "$PWD/stage" --prefix /usr
          test -L stage/usr/bin/rofi-wooordhunt
          stage/usr/bin/rofi-wooordhunt --help >/dev/null
          DESTDIR=$PWD/stage PREFIX=/usr ./install.sh --uninstall
          test ! -e stage/usr/share/rofi-wooordhunt
          ! DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1
      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - name: CI tools come from the lock, not the registry
        run: |
          if grep -rEn 'nix (run|shell) nixpkgs#' .github/workflows; then
            echo "unpinned registry lookup in a workflow — pin the tool in the flake's dev shell and use nix develop" >&2
            exit 1
          fi
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
